<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- علامات الميتا لتحسين مظهر الرابط عند مشاركته في الواتساب وتويتر -->
    <meta property="og:title" content="حاسبة القبول المدرسية 1448هـ">
    <meta property="og:description" content="أداة سريعة ودقيقة لمعرفة مرحلة القبول المناسبة للطالب (الصف الأول أو رياض الأطفال) بنقرة واحدة.">
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/ar/1/17/Saudi_Ministry_of_Education_Logo_2025.png">
    
    <title>حاسبة القبول للعام الدراسي 1448هـ</title>
    <style>
        :root {
            --primary-color: #0b5e56;
            --secondary-color: #128c7e;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --wa-color: #25D366;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator-container {
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            border-top: 6px solid var(--primary-color);
        }
        .moe-logo {
            max-width: 180px;
            height: auto;
            margin-bottom: 20px;
        }
        h2 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 1.5em;
        }
        p.subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 0.95em;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }
        input[type="date"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.3s ease;
            color: #333;
        }
        input[type="date"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(11, 94, 86, 0.2);
            outline: none;
        }
        .hijri-note {
            text-align: right;
            font-size: 0.8em;
            color: #888;
            margin-top: -15px;
            margin-bottom: 20px;
        }
        /* التأثير الحركي لظهور النتيجة */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-wrapper {
            display: none; /* مخفي افتراضياً */
            animation: fadeInDown 0.4s ease-out forwards;
        }
        .result {
            margin-top: 10px;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.1em;
            line-height: 1.6;
        }
        .result.success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .result.error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        /* أزرار الإجراءات */
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { opacity: 0.9; }
        .btn-wa {
            background-color: var(--wa-color);
            color: white;
        }
        .btn-reset {
            background-color: #f1f3f4;
            color: #5f6368;
        }
        .footer-note {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 0.85em;
            color: #888;
            line-height: 1.6;
        }
        .committee-signature {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <!-- إضافة الشعار الرسمي -->
        <img src="https://upload.wikimedia.org/wikipedia/ar/1/17/Saudi_Ministry_of_Education_Logo_2025.png?utm_source=ar.wikipedia.org&utm_campaign=index&utm_content=original" alt="شعار وزارة التعليم" class="moe-logo">
        
        <h2>حاسبة القبول للعام الدراسي 1448هـ</h2>
        <p class="subtitle">أداة سريعة لمعرفة مرحلة القبول المناسبة للطالب</p>

        <div class="input-group">
            <label for="dob">أدخل تاريخ ميلاد الطالب (بالميلادي):</label>
            <input type="date" id="dob" onchange="checkEligibility()">
        </div>
        <div class="hijri-note">
            * إذا كنت تعرف التاريخ الهجري فقط، يرجى تحويله أولاً.
        </div>

        <!-- حاوية النتيجة والأزرار -->
        <div id="resultWrapper" class="result-wrapper">
            <div id="resultBox" class="result"></div>
            
            <div class="actions">
                <a id="waShareBtn" href="#" target="_blank" class="btn btn-wa">
                    📱 شارك النتيجة
                </a>
                <button onclick="resetForm()" class="btn btn-reset">
                    🔄 فحص جديد
                </button>
            </div>
        </div>

        <div class="footer-note">
            متوافق مع الدليل التنظيمي للقبول والتسجيل
            <div class="committee-signature">
                لجنة القبول والتسجيل<br>
                الشريحة العاشرة - قطاع الدرعية
            </div>
        </div>
    </div>

    <script>
        function checkEligibility() {
            const dateInput = document.getElementById('dob').value;
            const resultWrapper = document.getElementById('resultWrapper');
            const resultBox = document.getElementById('resultBox');
            const waShareBtn = document.getElementById('waShareBtn');

            if (!dateInput) {
                resultWrapper.style.display = 'none';
                return;
            }

            let messageHtml = '';
            let plainTextForWa = '';
            let statusClass = 'success';

            if (dateInput <= '2020-08-24') {
                messageHtml = '🎒 <strong>مؤهل للصف الأول الابتدائي (قبول مباشر)</strong>';
                plainTextForWa = '🎒 مؤهل للصف الأول الابتدائي (قبول مباشر)';
            } 
            else if (dateInput >= '2020-08-25' && dateInput <= '2020-11-22') {
                messageHtml = '🎒 <strong>مؤهل للصف الأول الابتدائي (بشرط اجتياز سنة روضة)</strong><br><br>💡 <em>أو يحق له التسجيل في رياض الأطفال (المستوى الثالث KG3)</em>';
                plainTextForWa = '🎒 مؤهل للصف الأول الابتدائي (بشرط اجتياز سنة روضة)، أو يحق له التسجيل في رياض الأطفال (المستوى الثالث KG3).';
            } 
            else if (dateInput >= '2020-11-23' && dateInput <= '2021-08-24') {
                messageHtml = '🎨 <strong>مؤهل لمرحلة رياض الأطفال (المستوى الثالث KG3)</strong>';
                plainTextForWa = '🎨 مؤهل لمرحلة رياض الأطفال (المستوى الثالث KG3)';
            } 
            else if (dateInput >= '2021-08-25' && dateInput <= '2022-08-24') {
                messageHtml = '🎨 <strong>مؤهل لمرحلة رياض الأطفال (المستوى الثاني KG2)</strong>';
                plainTextForWa = '🎨 مؤهل لمرحلة رياض الأطفال (المستوى الثاني KG2)';
            } 
            else if (dateInput >= '2022-08-25' && dateInput <= '2023-08-24') {
                messageHtml = '🎨 <strong>مؤهل لمرحلة رياض الأطفال (المستوى الأول KG1)</strong>';
                plainTextForWa = '🎨 مؤهل لمرحلة رياض الأطفال (المستوى الأول KG1)';
            } 
            else {
                messageHtml = '❌ <strong>عذراً، الطالب غير مؤهل للتسجيل في هذا العام الدراسي (أصغر من السن النظامي).</strong>';
                plainTextForWa = '❌ عذراً، الطالب غير مؤهل للتسجيل في هذا العام الدراسي.';
                statusClass = 'error';
            }

            // عرض النتيجة بالتنسيق
            resultBox.innerHTML = messageHtml;
            resultBox.className = 'result ' + statusClass;
            
            // تجهيز رابط الواتساب
            const waMessage = `أهلاً! قمت بفحص تاريخ ميلاد الطالب (${dateInput}) عبر حاسبة القبول للعام 1448هـ، والنتيجة هي:\n\n${plainTextForWa}\n\nلجنة القبول والتسجيل - قطاع الدرعية.`;
            waShareBtn.href = `https://wa.me/?text=${encodeURIComponent(waMessage)}`;

            // إظهار الحاوية مع التأثير الحركي
            resultWrapper.style.display = 'block';
        }

        function resetForm() {
            document.getElementById('dob').value = '';
            document.getElementById('resultWrapper').style.display = 'none';
        }
    </script>

</body>
</html>
