<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التميز التعليمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-bg: #0f172a;
            --accent: #00f2fe;
            --secondary: #4facfe;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--main-bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(79, 172, 254, 0.05) 0%, transparent 40%);
            margin: 0;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* حاوية العرض الرئيسية */
        .wrapper {
            width: 100%;
            max-width: 1100px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            align-items: start;
        }

        /* الجانب الأيمن: لوحة المعلومات */
        .info-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 40px;
            position: sticky;
            top: 20px;
        }

        .badge {
            background: linear-gradient(90deg, var(--secondary), var(--accent));
            color: #000;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 20px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .meta-data {
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .meta-item i {
            margin-left: 10px;
            color: var(--accent);
        }

        /* الجانب الأيسر: لوحة النموذج الإبداعية */
        .form-viewport {
            background: #fff;
            border-radius: 30px;
            height: 850px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            transition: transform 0.3s ease;
        }

        .form-viewport:hover {
            transform: translateY(-5px);
        }

        /* إخفاء شريط التمرير الافتراضي */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* استخدام فلتر خفيف لجعل ألوان النموذج تندمج مع التصميم */
            filter: contrast(1.05);
        }

        /* لمسات جمالية للهواتف */
        @media (max-width: 900px) {
            .wrapper {
                grid-template-columns: 1fr;
            }
            .info-panel {
                position: relative;
                top: 0;
            }
            .form-viewport {
                height: 700px;
            }
        }

        /* تأثيرات الإضاءة الخلفية */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent);
            filter: blur(150px);
            opacity: 0.1;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="glow" style="top: 10%; right: 10%;"></div>
    <div class="glow" style="bottom: 10%; left: 10%;"></div>

    <div class="wrapper">
        
        <!-- لوحة التحكم والمعلومات -->
        <div class="info-panel">
            <div class="badge">رؤية ٢٠٣٠ التعليمية</div>
            <h1>بوابة قياس<br>التحصيل الدراسي</h1>
            <p class="description">
                نسعى من خلال هذه النافذة الرقمية إلى بناء جسر من الشراكة الحقيقية معكم. آراؤكم هي المحرك الأساسي لتطوير الرحلة التعليمية لأبنائكم.
            </p>
            
            <div class="meta-data">
                <div class="meta-item">
                    <span>📅 التاريخ الإداري: ٣٠ أبريل ٢٠٢٦</span>
                </div>
                <div class="meta-item">
                    <span>👤 إشراف: أمل الجهني</span>
                </div>
                <div class="meta-item">
                    <span>📍 القسم: التوجيه الطلابي</span>
                </div>
            </div>
        </div>

        <!-- إطار النموذج بتصميم الفتحة الرقمية -->
        <div class="form-viewport">
            <iframe src="https://forms.office.com/Pages/ResponsePage.aspx?id=0gr9a2BA-U-RAIEOdddRtYQ0RnDu8b9Es8ORQyKWVGpUNktMRzA0NU8ySlM1TEVKWlIyRVpETVY3UC4u&embed=true"></iframe>
        </div>

    </div>

</body>
</html>
